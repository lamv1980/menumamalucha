<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Administrar</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  :root{--tinta:#1B1740;--rosa:#D9006F;--sol:#FFB81C;--suave:#FFE6A8;--fondo:#FFEFF5;--apagado:#625D80;--linea:#D9D3EE;--verde:#0E9F4F;--mal:#B3262E;
        --display:"Bagel Fat One","Arial Rounded MT Bold",system-ui,sans-serif;--texto:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--texto);font-size:16px;line-height:1.4;background:var(--fondo);color:var(--tinta);padding-bottom:110px}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:3px solid var(--tinta);outline-offset:2px}
  header{background:var(--tinta);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  header h1{margin:0;font-family:var(--display);font-weight:400;font-size:1.35rem}
  header a{color:var(--sol);font-weight:700;font-size:.95rem}
  .wrap{max-width:760px;margin:0 auto;padding:0 18px}
  .tabs{display:flex;gap:8px;padding:12px 18px;max-width:760px;margin:0 auto;position:sticky;top:0;background:var(--fondo);z-index:5}
  .tab{flex:1;min-height:42px;border:2px solid var(--tinta);background:#fff;border-radius:999px;font-weight:800}
  .tab[aria-selected="true"]{background:var(--tinta);color:#fff}
  .card{background:#fff;border:2px solid var(--linea);border-radius:16px;padding:14px;margin-bottom:12px}
  h2{font-family:var(--display);font-weight:400;font-size:1.4rem;margin:22px 0 8px}
  label{display:block;font-size:.85rem;font-weight:700;margin:10px 0 4px}
  input[type=text],input[type=number],input[type=password],select{width:100%;min-height:46px;padding:10px 12px;border:2px solid var(--linea);border-radius:12px;background:#fff}
  input:focus,select:focus{outline:0;border-color:var(--tinta);box-shadow:0 0 0 3px var(--sol)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:90px 1fr;gap:10px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .chk{display:flex;align-items:center;gap:8px;font-size:.95rem;margin:0}
  .chk input{width:22px;height:22px}
  .tools{display:flex;gap:6px}
  .tools button{min-height:38px;border:2px solid var(--linea);background:#fff;border-radius:10px;padding:0 12px;font-weight:700}
  .tools .del{color:var(--mal)}
  .primary{background:var(--rosa);color:#fff;border:0;border-radius:14px;min-height:50px;padding:0 18px;font-weight:800}
  .ghost{width:100%;background:#fff;color:var(--rosa);border:2px dashed var(--rosa);border-radius:14px;min-height:50px;font-weight:800}
  .link{background:none;border:0;color:var(--rosa);font-weight:800;padding:8px 0;text-decoration:underline}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--linea);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
  .bar .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center}
  .bar .primary{flex:1}
  #msg{flex:1.3;font-size:.92rem;font-weight:700}
  .ok{color:var(--verde)} .bad{color:var(--mal)}
  .panel{display:none} .panel.on{display:block}

  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kpi{background:#fff;border:2px solid var(--linea);border-radius:16px;padding:12px 14px}
  .kpi b{display:block;font-family:var(--display);font-weight:400;font-size:1.6rem;line-height:1.1}
  .kpi span{font-size:.85rem;color:var(--apagado)}
  .rank{list-style:none;margin:0;padding:0}
  .rank li{padding:9px 0;border-bottom:2px dotted var(--linea)}
  .rank li:last-child{border-bottom:0}
  .rl{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .rl .n{font-weight:800;overflow-wrap:anywhere}
  .rl .v{font-family:var(--display);white-space:nowrap}
  .sub{font-size:.85rem;color:var(--apagado);margin-top:2px}
  .barra{height:8px;border-radius:99px;background:var(--linea);margin-top:6px;overflow:hidden}
  .barra i{display:block;height:100%;background:var(--rosa);border-radius:99px}
  .vacio{color:var(--apagado);font-size:.95rem;padding:6px 0}
  details.ped{border-bottom:2px solid var(--linea);padding:10px 0}
  details.ped summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
  details.ped summary::-webkit-details-marker{display:none}
  .ped dl{margin:8px 0 0;font-size:.92rem}
  .ped dt{font-weight:800;margin-top:6px}
  .ped dd{margin:0;color:var(--apagado)}
  .tab{font-size:.92rem;padding:0 4px}
  .chip{display:inline-block;font-size:.78rem;font-weight:800;border-radius:99px;padding:2px 10px;margin-left:8px;vertical-align:middle}
  .chip.vig{background:#D8F3E3;color:#0A6B35}
  .chip.ven{background:#FBDADC;color:#8E1B22}
  .chip.pau{background:var(--linea);color:var(--apagado)}
  .nuevo{margin-bottom:14px;background:var(--rosa);color:#fff;border:0;font-size:1.05rem}
  input[type=date]{width:100%;min-height:46px;padding:10px 12px;border:2px solid var(--linea);border-radius:12px;background:#fff}
  input[type=date]:disabled{opacity:.45}
  .foto{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center;margin-top:12px}
  .prev{width:76px;height:76px;border-radius:50%;background:var(--suave);display:flex;align-items:center;justify-content:center;font-size:2.2rem;overflow:hidden}
  .prev img{width:100%;height:100%;object-fit:cover}
  .fb{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
  .btn-file{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:12px;border:2px solid var(--tinta);background:#fff;font-weight:800;cursor:pointer;position:relative}
  .btn-file:focus-within{outline:3px solid var(--tinta);outline-offset:2px}
  .btn-file input{position:absolute;opacity:0;width:1px;height:1px}
  .fest{flex-basis:100%;font-size:.85rem;font-weight:700;color:var(--apagado);min-height:1.2em}
  #app{display:none}
</style>
</head>
<body>

<header>
  <h1>Administrar</h1>
  <a href="/">Ver menú</a>
</header>

<div class="wrap">
  <div class="card" id="login" style="margin-top:18px">
    <h2 style="margin-top:0">Entrar</h2>
    <label for="pass">Contraseña de administrador</label>
    <input id="pass" type="password" autocomplete="current-password">
    <p id="loginErr" class="bad" style="font-weight:700;display:none"></p>
    <div style="margin-top:12px"><button class="primary" onclick="login()">Entrar</button></div>
  </div>
</div>

<div id="app">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-menu" aria-selected="true"  onclick="tab('menu')">Menú</button>
    <button class="tab" role="tab" id="t-promos" aria-selected="false" onclick="tab('promos')">Promos</button>
    <button class="tab" role="tab" id="t-ventas" aria-selected="false" onclick="tab('ventas')">Ventas</button>
    <button class="tab" role="tab" id="t-pedidos" aria-selected="false" onclick="tab('pedidos')">Pedidos</button>
  </div>

  <div class="wrap">
    <!-- MENÚ -->
    <section class="panel on" id="p-menu">
      <p style="color:var(--apagado);font-size:.92rem;margin:4px 2px 12px">Edita tus productos y toca <b>Guardar cambios</b>. No se publican hasta que guardes.</p>
      <div id="list"></div>
      <button class="ghost" onclick="addItem()">+ Agregar producto</button>
      <datalist id="cats"></datalist>
    </section>

    <!-- PROMOS -->
    <section class="panel" id="p-promos">
      <p style="color:var(--apagado);font-size:.92rem;margin:4px 2px 12px">Las promociones aparecen arriba del menú, en un bloque destacado, hasta la fecha que elijas. Al vencer se ocultan solas.</p>
      <button class="ghost nuevo" onclick="addPromo()">+ Subir promoción del día</button>
      <div id="promoList"></div>
    </section>

    <!-- VENTAS -->
    <section class="panel" id="p-ventas">
      <label for="rango">Periodo</label>
      <select id="rango" onchange="renderVentas()">
        <option value="7">Últimos 7 días</option>
        <option value="30" selected>Últimos 30 días</option>
        <option value="90">Últimos 90 días</option>
        <option value="0">Todo el historial</option>
      </select>
      <div id="ventas"></div>
    </section>

    <!-- PEDIDOS -->
    <section class="panel" id="p-pedidos">
      <div class="top" style="margin-top:14px">
        <b id="pedCount"></b>
        <button class="link" onclick="csv()">Descargar CSV</button>
      </div>
      <div id="pedidos"></div>
    </section>
  </div>
</div>

<div class="bar" id="bar" style="display:none">
  <div class="in">
    <span id="msg" role="status"></span>
    <button class="primary" onclick="save()">Guardar cambios</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let pass = "";
let items = [];     // menú en edición
let pedidos = [];   // historial de pedidos
let pedidosCargados = false;
let promos = [];    // promociones en edición
let tabActual = "menu";
const hoyMX = () => new Date().toLocaleDateString("en-CA", { timeZone: "America/Mexico_City" });

try { pass = sessionStorage.getItem("adm") || ""; } catch(e){}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "$" + (Math.round(n * 100) / 100).toLocaleString("es-MX", {minimumFractionDigits: 0, maximumFractionDigits: 2});
const fmtFecha = iso => new Date(iso).toLocaleString("es-MX", {day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit"});

async function api(path, { method = "GET", body } = {}){
  const r = await fetch(path, {
    method,
    headers: { "content-type": "application/json", "x-admin-password": pass },
    body: body ? JSON.stringify(body) : undefined
  });
  let data = {}; try { data = await r.json(); } catch(e){}
  return { ok: r.ok, status: r.status, data };
}

/* ---------- Entrada ---------- */
async function login(){
  pass = $("pass").value;
  $("loginErr").style.display = "none";
  try {
    const r = await api("/api/menu", { method: "POST", body: { action: "login" } });
    if (!r.ok) throw new Error(r.data.error || "No se pudo entrar.");
    try { sessionStorage.setItem("adm", pass); } catch(e){}
    await start();
  } catch(e){
    $("loginErr").textContent = e.message;
    $("loginErr").style.display = "block";
  }
}
$("pass").addEventListener("keydown", e => { if (e.key === "Enter") login(); });

async function start(){
  $("login").style.display = "none";
  $("app").style.display = "block";
  try {
    const r = await fetch("/api/menu", { cache: "no-store" });
    const d = await r.json();
    items = Array.isArray(d.productos) ? d.productos : [];
  } catch(e){ items = []; }
  if (!items.length) addItem(true);
  render();
  const rp = await api("/api/promos?todas=1");
  promos = rp.ok ? (rp.data.promos || []) : [];
  renderPromos();
  $("bar").style.display = "block";
}

function tab(t){
  tabActual = t;
  ["menu","promos","ventas","pedidos"].forEach(k => {
    $("p-" + k).classList.toggle("on", k === t);
    $("t-" + k).setAttribute("aria-selected", k === t ? "true" : "false");
  });
  $("bar").style.display = (t === "menu" || t === "promos") ? "block" : "none";
  $("msg").textContent = "";
  if ((t === "ventas" || t === "pedidos") && !pedidosCargados) cargarPedidos();
  window.scrollTo({ top: 0 });
}
$("bar").style.display = "none";

/* ---------- Menú ---------- */

function addItem(silent){
  items.push({ id: 0, nombre: "", desc: "", categoria: items.length ? items[items.length-1].categoria : "", precio: 0, emoji: "🍽️", imagen: "", disponible: true });
  if (!silent) { render(); window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }); }
}
function del(i){
  const n = items[i].nombre || "este producto";
  if (confirm("¿Quitar " + n + " del menú?")) { items.splice(i, 1); render(); }
}
function move(i, d){
  const j = i + d;
  if (j < 0 || j >= items.length) return;
  [items[i], items[j]] = [items[j], items[i]];
  render();
}
function set(i, k, v){ items[i][k] = v; }

function render(){
  $("cats").innerHTML = [...new Set(items.map(p => p.categoria).filter(Boolean))].map(c => `<option value="${esc(c)}">`).join("");
  $("list").innerHTML = items.map((p, i) => `
    <div class="card">
      <div class="top">
        <label class="chk"><input type="checkbox" ${p.disponible !== false ? "checked" : ""} onchange="set(${i},'disponible',this.checked)"> Disponible</label>
        <div class="tools">
          <button onclick="move(${i},-1)" aria-label="Subir">↑</button>
          <button onclick="move(${i},1)" aria-label="Bajar">↓</button>
          <button class="del" onclick="del(${i})">Quitar</button>
        </div>
      </div>
      <label>Nombre</label>
      <input type="text" value="${esc(p.nombre)}" maxlength="80" oninput="set(${i},'nombre',this.value)">
      <label>Descripción (opcional)</label>
      <input type="text" value="${esc(p.desc)}" maxlength="160" oninput="set(${i},'desc',this.value)">
      <div class="row">
        <div><label>Precio</label>
          <input type="number" min="0" step="0.5" inputmode="decimal" value="${esc(p.precio)}" oninput="set(${i},'precio',parseFloat(this.value)||0)"></div>
        <div><label>Categoría</label>
          <input type="text" list="cats" value="${esc(p.categoria)}" maxlength="40" oninput="set(${i},'categoria',this.value)"></div>
      </div>
      ${bloqueFoto("items", i, p)}
    </div>`).join("");
}

// Foto del producto o promoción: vista previa, subir y quitar. Si no hay foto se usa el emoji.
function bloqueFoto(tipo, i, p){
  const campo = tipo === "items" ? "set" : "setP";
  return `<div class="foto">
      <div class="prev">${p.imagen ? `<img src="${esc(p.imagen)}" alt="">` : esc(p.emoji || "🍽️")}</div>
      <div class="fb">
        <label class="btn-file">${p.imagen ? "Cambiar foto" : "Subir foto"}
          <input type="file" accept="image/*" onchange="subirFoto(this,'${tipo}',${i})"></label>
        ${p.imagen ? `<button type="button" class="link" onclick="quitarFoto('${tipo}',${i})">Quitar foto</button>` : ""}
        <span class="fest" id="fs-${tipo}-${i}" role="status"></span>
      </div>
    </div>
    <label>Emoji (se usa si no hay foto)</label>
    <input type="text" value="${esc(p.emoji)}" maxlength="8" style="max-width:120px" oninput="${campo}(${i},'emoji',this.value)">`;
}

function coleccion(tipo){ return tipo === "items" ? items : promos; }

// Reduce la foto a 900 px y la convierte a JPG antes de subirla (rápido y ligero en el celular).
function reducirFoto(file, max = 900){
  return new Promise((ok, mal) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? ok(b) : mal(new Error("No se pudo procesar la foto.")), "image/jpeg", 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); mal(new Error("No se pudo leer la imagen. Prueba con otra foto.")); };
    img.src = url;
  });
}

async function subirFoto(inp, tipo, i){
  const f = inp.files && inp.files[0];
  if (!f) return;
  const st = document.getElementById(`fs-${tipo}-${i}`);
  st.className = "fest"; st.textContent = "Subiendo…";
  try {
    const blob = await reducirFoto(f);
    const r = await fetch("/api/foto", { method: "POST", headers: { "content-type": "image/jpeg", "x-admin-password": pass }, body: blob });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || "No se pudo subir la foto.");
    coleccion(tipo)[i].imagen = d.url;
    tipo === "items" ? render() : renderPromos();
    const m = $("msg"); m.className = "ok"; m.textContent = "Foto lista. Toca Guardar cambios para publicarla.";
  } catch(e) {
    st.className = "fest bad"; st.textContent = e.message;
  }
  inp.value = "";
}

function quitarFoto(tipo, i){
  coleccion(tipo)[i].imagen = "";
  tipo === "items" ? render() : renderPromos();
}

function save(){ return tabActual === "promos" ? savePromos() : saveMenu(); }

async function saveMenu(){
  const msg = $("msg");
  msg.className = ""; msg.textContent = "Guardando…";
  const valid = items.filter(p => (p.nombre || "").trim());
  if (!valid.length) { msg.className = "bad"; msg.textContent = "Agrega al menos un producto con nombre."; return; }
  try {
    const r = await api("/api/menu", { method: "POST", body: { productos: valid } });
    if (r.status === 401) {
      try { sessionStorage.removeItem("adm"); } catch(e){}
      throw new Error("Sesión vencida. Recarga e inicia sesión de nuevo.");
    }
    if (!r.ok) throw new Error(r.data.error || "No se pudo guardar.");
    items = r.data.productos || valid; render();
    msg.className = "ok"; msg.textContent = "Guardado. Ya está en el menú.";
  } catch(e){
    msg.className = "bad"; msg.textContent = e.message;
  }
}

/* ---------- Promociones ---------- */
function addPromo(){
  promos.unshift({ id: 0, nombre: "", desc: "", precio: 0, precioNormal: null, hasta: hoyMX(), emoji: "⭐", imagen: "", activa: true });
  renderPromos();
  const first = document.querySelector("#promoList input[type=text]");
  if (first) { first.focus(); first.scrollIntoView({ behavior: "smooth", block: "center" }); }
}
function delPromo(i){
  if (confirm("¿Quitar " + (promos[i].nombre || "esta promoción") + "?")) { promos.splice(i, 1); renderPromos(); }
}
function setP(i, k, v){ promos[i][k] = v; }
function sinFecha(i, on){ promos[i].hasta = on ? "" : hoyMX(); renderPromos(); }
function repetirHoy(i){ promos[i].hasta = hoyMX(); promos[i].activa = true; renderPromos(); }

function estadoPromo(p){
  if (p.activa === false) return `<span class="chip pau">Pausada</span>`;
  if (p.hasta && p.hasta < hoyMX()) return `<span class="chip ven">Vencida</span>`;
  return `<span class="chip vig">Vigente</span>`;
}

function renderPromos(){
  if (!promos.length) {
    $("promoList").innerHTML = `<div class="card"><p class="vacio">Aún no hay promociones. Toca <b>Subir promoción del día</b> para crear la primera.</p></div>`;
    return;
  }
  $("promoList").innerHTML = promos.map((p, i) => `
    <div class="card">
      <div class="top">
        <label class="chk"><input type="checkbox" ${p.activa !== false ? "checked" : ""} onchange="setP(${i},'activa',this.checked);renderPromos()"> Activa ${estadoPromo(p)}</label>
        <div class="tools"><button class="del" onclick="delPromo(${i})">Quitar</button></div>
      </div>
      <label>Nombre de la promoción</label>
      <input type="text" value="${esc(p.nombre)}" maxlength="80" placeholder="Ej. 3 tacos + refresco" oninput="setP(${i},'nombre',this.value)">
      <label>Descripción (opcional)</label>
      <input type="text" value="${esc(p.desc)}" maxlength="160" oninput="setP(${i},'desc',this.value)">
      <div class="row">
        <div><label>Precio de la promo</label>
          <input type="number" min="0" step="0.5" inputmode="decimal" value="${esc(p.precio)}" oninput="setP(${i},'precio',parseFloat(this.value)||0)"></div>
        <div><label>Precio normal (opcional)</label>
          <input type="number" min="0" step="0.5" inputmode="decimal" value="${p.precioNormal ? esc(p.precioNormal) : ""}" oninput="setP(${i},'precioNormal',parseFloat(this.value)||null)"></div>
      </div>
      <label>Válida hasta</label>
      <input type="date" value="${esc(p.hasta)}" ${p.hasta ? "" : "disabled"} oninput="setP(${i},'hasta',this.value);renderPromos()">
      <div class="top" style="margin-top:6px">
        <label class="chk"><input type="checkbox" ${p.hasta ? "" : "checked"} onchange="sinFecha(${i},this.checked)"> Sin fecha límite</label>
        <button class="link" onclick="repetirHoy(${i})">Repetir hoy</button>
      </div>
      ${bloqueFoto("promos", i, p)}
    </div>`).join("");
}

async function savePromos(){
  const msg = $("msg");
  msg.className = ""; msg.textContent = "Guardando…";
  const valid = promos.filter(p => (p.nombre || "").trim());
  const sinPrecio = valid.find(p => !(p.precio > 0));
  if (sinPrecio) { msg.className = "bad"; msg.textContent = "Ponle precio a \"" + sinPrecio.nombre + "\"."; return; }
  try {
    const r = await api("/api/promos", { method: "POST", body: { promos: valid } });
    if (r.status === 401) {
      try { sessionStorage.removeItem("adm"); } catch(e){}
      throw new Error("Sesión vencida. Recarga e inicia sesión de nuevo.");
    }
    if (!r.ok) throw new Error(r.data.error || "No se pudo guardar.");
    promos = r.data.promos || valid; renderPromos();
    msg.className = "ok"; msg.textContent = "Guardado. Ya está en el menú.";
  } catch(e){
    msg.className = "bad"; msg.textContent = e.message;
  }
}

/* ---------- Pedidos y ventas ---------- */
async function cargarPedidos(){
  $("ventas").innerHTML = $("pedidos").innerHTML = `<p class="vacio">Cargando…</p>`;
  const r = await api("/api/pedidos");
  if (!r.ok) {
    const m = `<p class="bad" style="font-weight:700">${esc(r.data.error || "No se pudieron cargar los pedidos.")}</p>`;
    $("ventas").innerHTML = $("pedidos").innerHTML = m; return;
  }
  pedidos = r.data.pedidos || [];
  pedidosCargados = true;
  renderVentas(); renderPedidos();
}

function enRango(){
  const dias = parseInt($("rango").value, 10);
  if (!dias) return pedidos;
  const corte = new Date(); corte.setHours(0,0,0,0); corte.setDate(corte.getDate() - (dias - 1));
  return pedidos.filter(p => new Date(p.fecha) >= corte);
}

function lista(titulo, filas, vacio){
  if (!filas.length) return `<h2>${titulo}</h2><div class="card"><p class="vacio">${vacio}</p></div>`;
  const max = Math.max(1, ...filas.map(f => f.barra));
  return `<h2>${titulo}</h2><div class="card"><ul class="rank">` + filas.map(f => `
    <li><div class="rl"><span class="n">${f.nombre}</span><span class="v">${f.valor}</span></div>
    ${f.sub ? `<div class="sub">${f.sub}</div>` : ""}
    <div class="barra" aria-hidden="true"><i style="width:${Math.round(f.barra / max * 100)}%"></i></div></li>`).join("") + `</ul></div>`;
}

function renderVentas(){
  const ps = enRango();
  if (!ps.length) {
    $("ventas").innerHTML = `<div class="card" style="margin-top:14px"><p class="vacio">Todavía no hay pedidos en este periodo. Cuando tus clientes manden pedidos desde el menú, aquí verás qué se vende más y quiénes compran seguido.</p></div>`;
    return;
  }
  const ventas = ps.reduce((s, p) => s + (p.total || 0), 0);

  // Productos
  // Se agrupa por el número fijo del producto, no por su nombre: si cambias un nombre, el
  // historial se conserva, y si dos productos se llaman parecido, no se mezclan.
  const prod = new Map();
  items.filter(p => p.nombre && p.id).forEach(p => prod.set(p.id, { nombre: p.nombre, unidades: 0, ingreso: 0 }));
  ps.forEach(p => p.items.forEach(it => {   // los pedidos vienen del más nuevo al más viejo
    const o = prod.get(it.id) || { nombre: it.nombre, unidades: 0, ingreso: 0 };
    o.unidades += it.qty; o.ingreso += it.qty * it.precio; prod.set(it.id, o);
  }));
  const pl = [...prod.values()].sort((a, b) => b.unidades - a.unidades || b.ingreso - a.ingreso);
  const fp = o => ({ nombre: esc(o.nombre), valor: o.unidades + (o.unidades === 1 ? " pza" : " pzas"), sub: money(o.ingreso) + " en ventas", barra: o.unidades });

  // Clientes (por teléfono)
  const cli = new Map();
  ps.forEach(p => {
    const t = p.cliente.telefono;
    const o = cli.get(t) || { tel: t, nombre: p.cliente.nombre, pedidos: 0, gasto: 0, ultimo: p.fecha };
    o.pedidos++; o.gasto += p.total || 0;
    if (p.fecha >= o.ultimo) { o.ultimo = p.fecha; o.nombre = p.cliente.nombre; }
    cli.set(t, o);
  });
  const cl = [...cli.values()];
  const mas = [...cl].sort((a, b) => b.pedidos - a.pedidos || b.gasto - a.gasto);
  const fc = o => ({
    nombre: esc(o.nombre) + ` <a href="https://wa.me/52${esc(o.tel)}" target="_blank" rel="noopener" style="font-size:.8rem;color:var(--rosa)">${esc(o.tel)}</a>`,
    valor: o.pedidos + (o.pedidos === 1 ? " pedido" : " pedidos"),
    sub: money(o.gasto) + " gastados · último: " + new Date(o.ultimo).toLocaleDateString("es-MX", {day:"numeric", month:"short"}),
    barra: o.pedidos
  });

  // La lista de "menos" solo muestra lo que no salió ya en la de "más".
  const top = pl.slice(0, 5), bajo = pl.slice(top.length).reverse().slice(0, 5);
  const ctop = mas.slice(0, 5);
  const cbajo = mas.slice(ctop.length).sort((a, b) => a.pedidos - b.pedidos || a.ultimo.localeCompare(b.ultimo)).slice(0, 5);

  $("ventas").innerHTML = `
    <div class="kpis" style="margin-top:14px">
      <div class="kpi"><b>${ps.length}</b><span>pedidos</span></div>
      <div class="kpi"><b>${money(ventas)}</b><span>en ventas</span></div>
      <div class="kpi"><b>${money(ventas / ps.length)}</b><span>ticket promedio</span></div>
      <div class="kpi"><b>${cl.length}</b><span>clientes distintos</span></div>
    </div>` +
    lista("Productos más vendidos", top.map(fp), "Sin datos.") +
    (bajo.length ? lista("Productos menos vendidos", bajo.map(fp), "") : "") +
    lista("Clientes más frecuentes", ctop.map(fc), "Sin datos.") +
    (cbajo.length ? lista("Clientes menos frecuentes", cbajo.map(fc), "") : "");
}

function renderPedidos(){
  $("pedCount").textContent = pedidos.length + (pedidos.length === 1 ? " pedido" : " pedidos");
  if (!pedidos.length) { $("pedidos").innerHTML = `<div class="card" style="margin-top:10px"><p class="vacio">Aún no hay pedidos guardados.</p></div>`; return; }
  $("pedidos").innerHTML = `<div class="card" style="margin-top:10px">` + pedidos.map((p, i) => `
    <details class="ped">
      <summary><span><b>${esc(p.cliente.nombre)}</b><br><span class="sub">${esc(fmtFecha(p.fecha))} · Folio ${esc(p.folio)}${p.telegram === false ? ` · <b class="bad">Sin aviso de Telegram</b>` : ""}</span></span><b>${money(p.total)}</b></summary>
      <dl>
        <dt>Productos</dt><dd>${p.items.map(it => `${it.qty} × ${esc(it.nombre)} (${money(it.precio * it.qty)})`).join("<br>")}</dd>
        <dt>Teléfono</dt><dd><a href="https://wa.me/52${esc(p.cliente.telefono)}" target="_blank" rel="noopener">${esc(p.cliente.telefono)}</a></dd>
        <dt>Dirección</dt><dd>${esc(p.cliente.calle)} #${esc(p.cliente.numext)}, Col. ${esc(p.cliente.colonia)}, C.P. ${esc(p.cliente.cp)}</dd>
        <dt>Pago</dt><dd>${esc(p.pago)}</dd>
        ${p.notas ? `<dt>Notas</dt><dd>${esc(p.notas)}</dd>` : ""}
      </dl>
      <button class="link" style="color:var(--mal)" onclick="borrarPedido(${i})">Eliminar pedido</button>
    </details>`).join("") + `</div>`;
}

async function borrarPedido(i){
  const p = pedidos[i];
  if (!confirm("¿Eliminar el pedido de " + p.cliente.nombre + "? Esto también lo quita de las ventas.")) return;
  const r = await api("/api/pedidos?key=" + encodeURIComponent(p.key), { method: "DELETE" });
  if (!r.ok) { alert(r.data.error || "No se pudo eliminar."); return; }
  pedidos.splice(i, 1);
  renderPedidos(); renderVentas();
}

function csv(){
  if (!pedidos.length) { alert("Aún no hay pedidos para descargar."); return; }
  const c = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const filas = [["Fecha","Folio","Nombre","Teléfono","Calle","Num ext","Colonia","CP","Pago","Productos","Total","Notas"]];
  pedidos.forEach(p => filas.push([
    p.fecha, p.folio, p.cliente.nombre, p.cliente.telefono, p.cliente.calle, p.cliente.numext, p.cliente.colonia, p.cliente.cp,
    p.pago, p.items.map(i => i.qty + " x " + i.nombre).join("; "), p.total, p.notas
  ]));
  const blob = new Blob(["﻿" + filas.map(f => f.map(c).join(",")).join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "pedidos.csv"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// Si ya había una sesión abierta en esta pestaña, entra directo.
if (pass) api("/api/menu", { method: "POST", body: { action: "login" } }).then(r => { if (r.ok) start(); else pass = ""; });
</script>
