<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFEFF5">
<title>Menú y pedidos</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  :root{
    --tinta:#1B1740;
    --rosa:#D9006F;
    --sol:#FFB81C;
    --sol-suave:#FFE6A8;
    --turquesa:#00A19B;
    --fondo:#FFEFF5;
    --blanco:#fff;
    --apagado:#625D80;
    --linea:#D9D3EE;
    --verde:#0E9F4F;
    --display:"Bagel Fat One","Arial Rounded MT Bold",system-ui,sans-serif;
    --texto:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:var(--texto);font-size:16px;line-height:1.4;background:var(--fondo);color:var(--tinta);padding-bottom:110px}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:3px solid var(--tinta);outline-offset:2px}

  /* ---------- Encabezado: papel picado ---------- */
  .papel{height:76px;background-image:var(--papel,url("/img/papel.svg"));background-repeat:repeat-x;background-position:left top;background-size:240px 76px;transform-origin:50% 0;animation:sway 7s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:skewX(-1.4deg)}50%{transform:skewX(1.4deg)}}
  .marca{max-width:760px;margin:0 auto;padding:6px 18px 20px}
  .marca h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(2.6rem,12vw,4rem);line-height:.95;letter-spacing:-.01em;text-shadow:3px 3px 0 var(--sol);overflow-wrap:anywhere}
  .marca p{margin:12px 0 0;color:var(--apagado);font-size:1rem;max-width:32ch}
  .marca .saludo{margin-top:10px;color:var(--rosa);font-weight:800;font-size:1.05rem}

  /* ---------- Categorías ---------- */
  .wrap{max-width:760px;margin:0 auto;padding:0 18px}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 18px;margin:0 -18px;position:sticky;top:0;z-index:5;background:var(--fondo);scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .chip{flex:none;min-height:40px;padding:0 16px;border:2px solid var(--tinta);background:var(--blanco);border-radius:999px;font-weight:700;font-size:.95rem}
  .chip[aria-pressed="true"]{background:var(--tinta);color:var(--blanco)}

  /* ---------- Carta ---------- */
  .cat{margin-top:22px}
  .cat-title{margin:0 0 4px;font-family:var(--display);font-weight:400;font-size:1.6rem;line-height:1.1}
  .rows{list-style:none;margin:0;padding:0}
  .row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:2px solid var(--linea)}
  .row:last-child{border-bottom:0}
  .row.agotado{opacity:.55}
  .thumb{width:52px;height:52px;border-radius:50%;background:var(--sol-suave);display:flex;align-items:center;justify-content:center;font-size:1.7rem;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .linea{display:flex;align-items:baseline;gap:8px}
  .nombre{font-weight:800;font-size:1.05rem;line-height:1.2}
  .punteado{flex:1;min-width:10px;border-bottom:3px dotted var(--linea);transform:translateY(-3px)}
  .precio{font-family:var(--display);font-size:1.15rem;white-space:nowrap}
  .desc{margin:3px 0 0;color:var(--apagado);font-size:.9rem}
  .agotado-txt{font-weight:700;font-size:.85rem;color:var(--apagado)}

  .mas{width:44px;height:44px;border:0;border-radius:50%;background:var(--rosa);color:#fff;font-size:1.6rem;line-height:1;display:flex;align-items:center;justify-content:center}
  .cant{display:flex;align-items:center;border:2px solid var(--tinta);border-radius:999px;background:var(--blanco)}
  .cant button{width:38px;height:40px;border:0;background:none;font-size:1.3rem;line-height:1;font-weight:700}
  .cant button:last-child{color:var(--rosa)}
  .cant span{min-width:20px;text-align:center;font-weight:800}

  .promos{background:var(--sol-suave);border:2px solid var(--tinta);border-radius:20px;padding:14px 14px 4px;margin-top:20px}
  .promos .cat-title{margin-bottom:0}
  .promos .desc{color:var(--tinta)}
  .promos .thumb{background:#fff}
  .promos .row{border-bottom-color:rgba(27,23,64,.18)}
  .promos .linea{display:block}
  .promos .punteado{display:none}
  .promos .precio{display:block;margin-top:3px}
  .cant button{border-radius:999px}
  .antes{font-family:var(--texto);font-weight:600;font-size:.85rem;color:var(--apagado);margin-right:4px}
  .pie{text-align:center;padding:30px 0 6px;font-size:.8rem}
  .pie a{color:var(--apagado)}

  /* ---------- Barra del pedido ---------- */
  .barra{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:none;z-index:10;background:linear-gradient(to top,var(--fondo) 60%,transparent)}
  .barra.show{display:block}
  .barra button{width:100%;max-width:728px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--tinta);color:#fff;border:0;border-radius:16px;padding:15px 18px;font-weight:800;font-size:1rem}
  .barra .tot{font-family:var(--display);font-weight:400;font-size:1.25rem;color:var(--sol)}

  /* ---------- Pedido (hoja inferior) ---------- */
  .modal{position:fixed;inset:0;background:rgba(27,23,64,.55);display:none;z-index:20}
  .modal.show{display:flex;align-items:flex-end;justify-content:center}
  .hoja{background:var(--fondo);width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:sube .22s ease-out}
  @keyframes sube{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
  .hoja h2{margin:0 0 6px;font-family:var(--display);font-weight:400;font-size:1.8rem;line-height:1.1}
  .hoja h3{margin:22px 0 2px;font-family:var(--display);font-weight:400;font-size:1.25rem}
  .ln{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:2px dotted var(--linea)}
  .ln .q{display:flex;align-items:center;gap:2px;flex:none}
  .ln .q button{width:36px;height:36px;border:2px solid var(--tinta);border-radius:50%;background:var(--blanco);font-size:1.1rem;line-height:1;font-weight:700}
  .total{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 2px;font-weight:800}
  .total b{font-family:var(--display);font-weight:400;font-size:1.7rem}

  label{display:block;font-size:.88rem;font-weight:700;margin:14px 0 5px}
  input,select,textarea{width:100%;min-height:48px;padding:11px 13px;border:2px solid var(--linea);border-radius:12px;background:var(--blanco)}
  textarea{min-height:0}
  input:focus,select:focus,textarea:focus{outline:0;border-color:var(--tinta);box-shadow:0 0 0 3px var(--sol)}
  .fila{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .info-pago{background:var(--sol-suave);border-radius:12px;padding:11px 13px;font-size:.9rem;margin-top:8px;display:none}
  .err{color:#B3261E;font-weight:700;font-size:.92rem;margin-top:14px;display:none}
  .acciones{display:flex;gap:10px;margin-top:20px}
  .acciones button{min-height:52px;border-radius:14px;font-weight:800;font-size:1rem;padding:0 16px}
  .volver{flex:1;background:var(--blanco);border:2px solid var(--tinta)}
  .enviar{flex:2;background:var(--verde);color:#fff;border:0}
  .cerrar{flex:2;background:var(--tinta);color:#fff;border:0}

  @media (min-width:640px){
    .modal.show{align-items:center}
    .hoja{border-radius:24px}
  }
  @media (prefers-reduced-motion:reduce){
    .papel{animation:none}
    .hoja{animation:none}
  }
</style>
</head>
<body>

<header>
  <div class="papel" aria-hidden="true"></div>
  <div class="marca">
    <h1 id="bizName">sazon de la abuela</h1>
    <p id="bizTag">Arma tu pedido y envíalo desde aquí</p>
    <p class="saludo" id="saludo" hidden></p>
  </div>
</header>

<main class="wrap">
  <div class="tabs" id="tabs" role="group" aria-label="Categorías"></div>
  <div id="menu"></div>
  <div class="pie"><a href="/admin.html">Administrar menú</a></div>
</main>

<div class="barra" id="cartbar">
  <button onclick="openCheckout()"><span id="cartCount">0 productos</span><span>Ver pedido <span class="tot" id="cartTotal">$0</span></span></button>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeCheckout()">
  <div class="hoja" role="dialog" aria-modal="true" aria-labelledby="tituloPedido">
    <div id="gracias" hidden style="text-align:left">
      <h2>¡Pedido enviado!</h2>
      <p id="graciasTxt" style="font-size:1.05rem;margin:8px 0 0"></p>
      <p style="color:var(--apagado);margin:10px 0 0">Te contactaremos al teléfono que nos diste para confirmar tu pedido.</p>
      <div class="acciones">
        <button type="button" class="cerrar" onclick="closeCheckout()">Volver al menú</button>
      </div>
    </div>

    <div id="pedidoForm">
    <h2 id="tituloPedido">Tu pedido</h2>
    <div id="summary"></div>
    <div class="total"><span>Total</span><b id="sumTotal">$0</b></div>

    <h3>Tus datos</h3>
    <form id="form" autocomplete="on" novalidate>
      <label for="nombre">Nombre completo</label>
      <input id="nombre" name="name" autocomplete="name" required>

      <label for="telefono">Teléfono (10 dígitos)</label>
      <input id="telefono" name="tel" type="tel" inputmode="numeric" maxlength="14" autocomplete="tel-national" required>

      <label for="calle">Calle</label>
      <input id="calle" name="street" autocomplete="address-line1" required>

      <div class="fila">
        <div>
          <label for="numext">Número exterior</label>
          <input id="numext" name="numext" required>
        </div>
        <div>
          <label for="cp">Código postal</label>
          <input id="cp" name="cp" inputmode="numeric" maxlength="5" autocomplete="postal-code" required>
        </div>
      </div>

      <label for="colonia">Colonia</label>
      <input id="colonia" name="colonia" required>

      <label for="pago">¿Cómo vas a pagar?</label>
      <input id="pago" name="pago" list="sugPago" maxlength="120" autocomplete="off" placeholder="Ej. efectivo, pago con $500" required>
      <datalist id="sugPago"></datalist>
      <div class="info-pago" id="payInfo"></div>

      <label for="notas">Notas o referencias (opcional)</label>
      <textarea id="notas" rows="2" placeholder="Ej. portón negro, sin cebolla"></textarea>

      <input id="empresa" name="empresa" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">

      <div class="err" id="err" role="alert"></div>

      <div class="acciones">
        <button type="button" class="volver" onclick="closeCheckout()">Seguir pidiendo</button>
        <button type="submit" class="enviar">Enviar pedido</button>
      </div>
    </form>
    </div>
  </div>
</div>

<script>
/* =====================================================
   CONFIGURACIÓN — EDITA SOLO ESTA SECCIÓN
   ===================================================== */
const CONFIG = {
  negocio: "Mi Negocio",
  eslogan: "Arma tu pedido y envíalo desde aquí",
  moneda: "$",
  // Tema visual automático según la fecha (mes, semana y fiestas de México).
  // Para apagarlo pon temaAutomatico: false. Para fijar uno, pon su id en temaFijo
  // (por ejemplo "muertos", "navidad", "clasico"). Ver la lista en FESTIVOS más abajo.
  temaAutomatico: true,
  temaFijo: "",
  // Sugerencias de pago (el cliente puede escribir lo que quiera). 'info' es opcional
  // y se muestra al cliente si lo que escribe coincide, por ejemplo tu CLABE.
  pagos: [
    { nombre: "Efectivo", info: "Paga al recibir tu pedido." },
    { nombre: "Transferencia", info: "Banco: XXXX · CLABE: 000000000000000000 · A nombre de: Tu Nombre" },
    { nombre: "Tarjeta (terminal al entregar)", info: "" }
  ]
};

// Estos productos son solo de ejemplo. Cuando guardes tu menú en /admin.html,
// el sitio usa ese menú y esta lista deja de verse.
let PRODUCTOS = [
  { id: 1, categoria: "Platillos", nombre: "Producto de ejemplo 1", desc: "Descripción breve del producto", precio: 80,  emoji: "🍔" },
  { id: 2, categoria: "Platillos", nombre: "Producto de ejemplo 2", desc: "Descripción breve del producto", precio: 95,  emoji: "🌮" },
  { id: 3, categoria: "Platillos", nombre: "Producto de ejemplo 3", desc: "Descripción breve del producto", precio: 120, emoji: "🍕" },
  { id: 4, categoria: "Bebidas",   nombre: "Refresco",              desc: "600 ml",                         precio: 25,  emoji: "🥤" },
  { id: 5, categoria: "Bebidas",   nombre: "Agua fresca",           desc: "1 litro",                        precio: 35,  emoji: "🧃" },
  { id: 6, categoria: "Postres",   nombre: "Postre del día",        desc: "Pregunta por el sabor",          precio: 45,  emoji: "🍰" }
];
/* ===================================================== */

/* =====================================================
   TEMAS POR FECHA (automático)
   - Cada mes tiene su paleta.
   - Cada lunes cambia el orden de colores y la figura del papel picado.
   - En fiestas de México se usa un tema propio con saludo.
   Para probar una fecha: agrega ?fecha=2026-11-02 al enlace.
   Para probar un tema:   agrega ?tema=muertos al enlace.
   ===================================================== */
const TINTA = "#1B1740";
const MOTIVOS = ["circulo", "diamante", "estrella", "flor", "corazon", "sol"];

const CLASICO = { id: "clasico", fondo: "#FFEFF5", pri: "#D9006F", acento: "#FFB81C", suave: "#FFE6A8",
                  flags: ["#D9006F", "#FFB81C", "#00A19B", "#4B3FD1"], motivo: "circulo", saludo: "" };

// Paleta base de cada mes (0 = enero).
const MESES = [
  { fondo: "#EEF3FF", pri: "#2F55D4", acento: "#FFC83D", suave: "#D7E1FF", flags: ["#2F55D4", "#FFC83D", "#00A19B", "#D9006F"] },
  { fondo: "#FFEFF3", pri: "#C8123F", acento: "#FFC2CF", suave: "#FFD0D9", flags: ["#C8123F", "#E5007D", "#8E1B5A", "#FF6B8B"] },
  { fondo: "#EFFAEF", pri: "#16702F", acento: "#FFD23F", suave: "#CDEFC9", flags: ["#1E8E3E", "#FFD23F", "#D9006F", "#00A19B"] },
  { fondo: "#F2F9FF", pri: "#0A74B8", acento: "#FFC93C", suave: "#D5ECFB", flags: ["#0A74B8", "#FF7A59", "#FFC93C", "#7A4BD6"] },
  { fondo: "#FFEFF6", pri: "#C21F78", acento: "#FFC93C", suave: "#FFD3E6", flags: ["#C21F78", "#FF7A59", "#FFC93C", "#00A19B"] },
  { fondo: "#EAFBF8", pri: "#00706B", acento: "#FFB81C", suave: "#C5F0EA", flags: ["#00857F", "#FFB81C", "#2F55D4", "#D9006F"] },
  { fondo: "#EAF8FF", pri: "#0072B5", acento: "#FFB81C", suave: "#C9ECFB", flags: ["#0072B5", "#FFB81C", "#FF5A5F", "#00A19B"] },
  { fondo: "#FFF0EE", pri: "#C73A26", acento: "#FFB81C", suave: "#FFD4CD", flags: ["#C73A26", "#FFB81C", "#00A19B", "#4B3FD1"] },
  { fondo: "#F1FAF1", pri: "#0B7A3E", acento: "#FFC83D", suave: "#CDEBD2", flags: ["#0B7A3E", "#C8102E", "#FFC83D", "#00A19B"] },
  { fondo: "#FFF0E3", pri: "#C2410C", acento: "#FFB81C", suave: "#FFDDBF", flags: ["#C2410C", "#6D28D9", "#FFB81C", "#D9006F"] },
  { fondo: "#F5F0FF", pri: "#6D28D9", acento: "#FFB81C", suave: "#E2D6FF", flags: ["#6D28D9", "#E8590C", "#FFB81C", "#D9006F"] },
  { fondo: "#F0F8F2", pri: "#B3202A", acento: "#FFC83D", suave: "#CFE8D6", flags: ["#B3202A", "#1E7B43", "#FFC83D", "#1E7B43"] }
];

// Rangos de fechas. fijo(mesInicio, díaInicio, mesFin, díaFin); si el fin es menor, cruza el año.
const D = (y, m, d) => new Date(y, m - 1, d);
const fijo = (m1, d1, m2, d2) => y => [D(y, m1, d1), D(m2 >= m1 ? y : y + 1, m2, d2)];

function pascua(y){ // Domingo de Pascua (calendario gregoriano)
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4,
        f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30,
        i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7,
        m = Math.floor((a + 11 * h + 22 * l) / 451),
        mes = Math.floor((h + l - 7 * m + 114) / 31), dia = ((h + l - 7 * m + 114) % 31) + 1;
  return D(y, mes, dia);
}
const semanaSanta = y => { const p = pascua(y), i = new Date(p); i.setDate(i.getDate() - 7); return [i, p]; };
const diaDelPadre = y => { // tercer domingo de junio, y la semana anterior
  const dow = D(y, 6, 1).getDay(), tercero = 1 + ((7 - dow) % 7) + 14;
  return [D(y, 6, tercero - 6), D(y, 6, tercero)];
};

const PATRIO = { fondo: "#F0FAF2", pri: "#0B7A3E", acento: "#FFC83D", suave: "#CDEBD2", flags: ["#0B7A3E", "#C8102E", "#0B7A3E", "#C8102E"] };

// Fiestas. 'id' sirve para probar con ?tema=id o fijarlo en CONFIG.temaFijo.
const FESTIVOS = [
  { id: "anonuevo",   rango: fijo(12, 29, 1, 5),  motivo: "estrella",  saludo: "¡Feliz año nuevo!",
    pal: { fondo: "#EDF0FF", pri: "#2B3FBF", acento: "#FFC83D", suave: "#D9DEFF", flags: ["#2B3FBF", "#FFC83D", "#D9006F", "#00A19B"] } },
  { id: "reyes",      rango: fijo(1, 6, 1, 8),    motivo: "estrella",  saludo: "Feliz Día de Reyes",
    pal: { fondo: "#F4EEFF", pri: "#6D28D9", acento: "#FFC83D", suave: "#E2D6FF", flags: ["#6D28D9", "#FFC83D", "#D9006F", "#00A19B"] } },
  { id: "amistad",    rango: fijo(2, 8, 2, 14),   motivo: "corazon",   saludo: "Feliz Día del Amor y la Amistad", pal: MESES[1] },
  { id: "bandera",    rango: fijo(2, 22, 2, 24),  motivo: "estrella",  saludo: "Feliz Día de la Bandera", pal: PATRIO },
  { id: "mujer",      rango: fijo(3, 6, 3, 8),    motivo: "flor",      saludo: "Feliz Día de la Mujer",
    pal: { fondo: "#F6EEFF", pri: "#7B2CBF", acento: "#FFC83D", suave: "#E5D3F8", flags: ["#7B2CBF", "#D9006F", "#FFC83D", "#00A19B"] } },
  { id: "semanasanta", rango: semanaSanta,        motivo: "flor",      saludo: "Semana Santa",
    pal: { fondo: "#F3EEFA", pri: "#5B2A86", acento: "#FFC83D", suave: "#E4D8F3", flags: ["#5B2A86", "#B8860B", "#5B2A86", "#B8860B"] } },
  { id: "ninos",      rango: fijo(4, 24, 4, 30),  motivo: "circulo",   saludo: "Feliz Día del Niño",
    pal: { fondo: "#EEF9FF", pri: "#0A74B8", acento: "#FFC83D", suave: "#D2EBFA", flags: ["#E5007D", "#FFB81C", "#00A19B", "#4B3FD1"] } },
  { id: "madres",     rango: fijo(5, 4, 5, 10),   motivo: "flor",      saludo: "Feliz Día de las Madres",
    pal: { fondo: "#FFEFF6", pri: "#C21F78", acento: "#FFC2DE", suave: "#FFD3E6", flags: ["#C21F78", "#FF7A59", "#FFB81C", "#00A19B"] } },
  { id: "padre",      rango: diaDelPadre,         motivo: "diamante",  saludo: "Feliz Día del Padre",
    pal: { fondo: "#EAF3FF", pri: "#1F4FA8", acento: "#FFC83D", suave: "#CFE0FA", flags: ["#1F4FA8", "#00857F", "#FFB81C", "#1F4FA8"] } },
  { id: "patrias",    rango: fijo(9, 8, 9, 16),   motivo: "estrella",  saludo: "¡Viva México!", pal: PATRIO },
  { id: "muertos",    rango: fijo(10, 25, 11, 2), motivo: "calavera",  saludo: "Día de Muertos",
    pal: { fondo: "#FFF0E0", pri: "#C2410C", acento: "#FFB81C", suave: "#FFD9B0", flags: ["#E8590C", "#7B2CBF", "#D9006F", "#FFB81C"] } },
  { id: "revolucion", rango: fijo(11, 14, 11, 20), motivo: "estrella", saludo: "Aniversario de la Revolución", pal: PATRIO },
  { id: "guadalupe",  rango: fijo(12, 10, 12, 12), motivo: "flor",     saludo: "Día de la Virgen de Guadalupe",
    pal: { fondo: "#EAF6F4", pri: "#0B6E73", acento: "#FFC83D", suave: "#C8E8E4", flags: ["#0B6E73", "#D9006F", "#FFC83D", "#0B6E73"] } },
  { id: "posadas",    rango: fijo(12, 16, 12, 23), motivo: "estrella", saludo: "¡Felices posadas!",
    pal: { fondo: "#F4FBF4", pri: "#B3202A", acento: "#FFC83D", suave: "#CFE8D6", flags: ["#B3202A", "#1E7B43", "#FFC83D", "#1E7B43"] } },
  { id: "navidad",    rango: fijo(12, 24, 12, 28), motivo: "arbol",    saludo: "¡Feliz Navidad!",
    pal: { fondo: "#F4FBF4", pri: "#1E7B43", acento: "#FFC83D", suave: "#CFE8D6", flags: ["#1E7B43", "#B3202A", "#FFC83D", "#B3202A"] } }
];

function fechaActual(){
  const q = new URLSearchParams(location.search).get("fecha");
  if (q && /^\d{4}-\d{2}-\d{2}$/.test(q)) { const [y, m, d] = q.split("-").map(Number); return D(y, m, d); }
  const n = new Date(); return D(n.getFullYear(), n.getMonth() + 1, n.getDate());
}

// Número de semana (cambia cada lunes).
function semanaNum(f){
  const lunes = new Date(f); lunes.setDate(f.getDate() - ((f.getDay() + 6) % 7));
  return Math.floor(Math.round((lunes - D(2024, 1, 1)) / 864e5) / 7);
}

function elegirTema(f){
  const forzado = new URLSearchParams(location.search).get("tema") || CONFIG.temaFijo;
  if (forzado === "clasico") return { ...CLASICO, rot: 0 };
  const w = semanaNum(f);
  const festivo = forzado
    ? FESTIVOS.find(x => x.id === forzado)
    : (CONFIG.temaAutomatico === false ? null : FESTIVOS.find(x => [f.getFullYear() - 1, f.getFullYear()].some(y => { const [a, b] = x.rango(y); return f >= a && f <= b; })));
  if (festivo) return { id: festivo.id, ...festivo.pal, motivo: festivo.motivo, saludo: festivo.saludo, rot: w % 4 };
  if (CONFIG.temaAutomatico === false) return { ...CLASICO, rot: 0 };
  const base = MESES[f.getMonth()];
  return { id: "mes", ...base, motivo: MOTIVOS[w % MOTIVOS.length], saludo: "", rot: w % 4 };
}

// Figura recortada en cada banderín (c = color del banderín, bg = color de fondo).
function figura(m, c, bg){
  switch (m) {
    case "corazon": return `<path d="M30 37C17 29 19 17 26.2 17c2.2 0 3.8 1.3 3.8 3 0-1.7 1.6-3 3.8-3C41 17 43 29 30 37z" fill="${bg}"/>`;
    case "estrella": {
      const p = []; for (let i = 0; i < 10; i++) { const r = i % 2 ? 4.4 : 10.5, a = -Math.PI / 2 + i * Math.PI / 5; p.push((30 + r * Math.cos(a)).toFixed(1) + "," + (26 + r * Math.sin(a)).toFixed(1)); }
      return `<polygon points="${p.join(" ")}" fill="${bg}"/>`;
    }
    case "diamante": return `<path d="M30 15l10 11-10 11-10-11z" fill="${bg}"/><circle cx="30" cy="26" r="3.2" fill="${c}"/>`;
    case "flor": {
      let s = ""; for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; s += `<circle cx="${(30 + 6.5 * Math.cos(a)).toFixed(1)}" cy="${(26 + 6.5 * Math.sin(a)).toFixed(1)}" r="4.3" fill="${bg}"/>`; }
      return s + `<circle cx="30" cy="26" r="3" fill="${c}"/>`;
    }
    case "sol": {
      let s = `<circle cx="30" cy="26" r="6.5" fill="${bg}"/>`;
      for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; s += `<line x1="${(30 + 9.5 * Math.cos(a)).toFixed(1)}" y1="${(26 + 9.5 * Math.sin(a)).toFixed(1)}" x2="${(30 + 13 * Math.cos(a)).toFixed(1)}" y2="${(26 + 13 * Math.sin(a)).toFixed(1)}" stroke="${bg}" stroke-width="2.4" stroke-linecap="round"/>`; }
      return s + `<circle cx="30" cy="26" r="2.6" fill="${c}"/>`;
    }
    case "calavera": return `<rect x="20.5" y="15" width="19" height="16" rx="9" fill="${bg}"/><rect x="24.5" y="27" width="11" height="9" rx="2" fill="${bg}"/>` +
      `<circle cx="26" cy="23.5" r="3" fill="${c}"/><circle cx="34" cy="23.5" r="3" fill="${c}"/><path d="M30 27l-1.8 3h3.6z" fill="${c}"/>` +
      `<path d="M27.5 31v5M30 31v5M32.5 31v5" stroke="${c}" stroke-width="1.2"/>`;
    case "arbol": return `<path d="M30 14l8 10h-4l7 9H19l7-9h-4z" fill="${bg}"/><rect x="28" y="33" width="4" height="4" fill="${bg}"/>`;
    default: return `<circle cx="30" cy="26" r="9" fill="${bg}"/><circle cx="30" cy="26" r="3.5" fill="${c}"/>`;
  }
}

function papelURI(t){
  let s = `<svg xmlns="http://www.w3.org/2000/svg" width="240" height="76" viewBox="0 0 240 76"><line x1="0" y1="3" x2="240" y2="3" stroke="${TINTA}" stroke-width="2"/>`;
  for (let i = 0; i < 4; i++) {
    const c = t.flags[(i + t.rot) % 4];
    s += `<g transform="translate(${i * 60} 0)"><path d="M4 3h52v58l-8 9-9-9-9 9-9-9-9 9-8-9z" fill="${c}"/>${figura(t.motivo, c, t.fondo)}` +
         `<circle cx="14" cy="12" r="3" fill="${t.fondo}"/><circle cx="46" cy="12" r="3" fill="${t.fondo}"/>` +
         `<circle cx="20" cy="48" r="3" fill="${t.fondo}"/><circle cx="40" cy="48" r="3" fill="${t.fondo}"/></g>`;
  }
  return `url("data:image/svg+xml,${encodeURIComponent(s + "</svg>")}")`;
}

function aplicarTema(){
  const t = elegirTema(fechaActual());
  const r = document.documentElement.style;
  r.setProperty("--fondo", t.fondo);
  r.setProperty("--rosa", t.pri);
  r.setProperty("--sol", t.acento);
  r.setProperty("--sol-suave", t.suave);
  r.setProperty("--papel", papelURI(t));
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", t.fondo);
  const s = document.getElementById("saludo");
  if (t.saludo) { s.textContent = t.saludo; s.hidden = false; } else s.hidden = true;
}
aplicarTema();

const $ = id => document.getElementById(id);
const money = n => CONFIG.moneda + n.toLocaleString("es-MX", {minimumFractionDigits: 0, maximumFractionDigits: 2});
let cart = {};
let currentCat = "Todos";
let focusKey = null;
let refPedido = null;
const CAT_PROMO = "Promociones del día";

try { cart = JSON.parse(localStorage.getItem("cart_v1") || "{}"); } catch(e) { cart = {}; }

// limpia del carrito productos que ya no existen o se agotaron
function cleanCart(){
  Object.keys(cart).forEach(id => {
    const p = PRODUCTOS.find(p => p.id == id);
    if (!p || p.disponible === false) delete cart[id];
  });
  saveCart();
}

function saveCart(){ try { localStorage.setItem("cart_v1", JSON.stringify(cart)); } catch(e){} }

async function loadMenu(){
  try {
    const r = await fetch("/api/menu", { cache: "no-store" });
    if (r.ok) {
      const d = await r.json();
      if (Array.isArray(d.productos) && d.productos.length) PRODUCTOS = d.productos;
    }
  } catch(e) { /* si falla, se usa la lista incluida en este archivo */ }

  // Promociones del día: se muestran primero y se piden igual que cualquier producto.
  try {
    const r = await fetch("/api/promos", { cache: "no-store" });
    if (r.ok) {
      const d = await r.json();
      const promos = (d.promos || []).map(p => ({
        id: 100000 + p.id, categoria: CAT_PROMO, promo: true,
        nombre: p.nombre, precio: p.precio, precioNormal: p.precioNormal,
        desc: [p.desc, vigencia(p.hasta, d.hoy)].filter(Boolean).join(" · "),
        emoji: p.emoji || "⭐", imagen: p.imagen
      }));
      PRODUCTOS = [...promos, ...PRODUCTOS.filter(p => !p.promo)];
    }
  } catch(e) { /* sin promociones */ }
  cleanCart();
}

function vigencia(hasta, hoy){
  if (!hasta) return "";
  if (hasta === hoy) return "Válida hoy";
  return "Hasta el " + new Date(hasta + "T12:00:00").toLocaleDateString("es-MX", { day: "numeric", month: "short" });
}

async function init(){
  await loadMenu();
  document.title = CONFIG.negocio + " · Menú";
  $("bizName").textContent = CONFIG.negocio;
  $("bizTag").textContent = CONFIG.eslogan;
  // El cliente escribe libremente cómo va a pagar. Las opciones de CONFIG.pagos
  // solo se sugieren mientras escribe, y si coincide una, se le muestra su información.
  CONFIG.pagos.forEach(p => {
    const o = document.createElement("option");
    o.value = p.nombre; $("sugPago").appendChild(o);
  });
  $("pago").addEventListener("input", () => {
    const txt = $("pago").value.trim().toLowerCase();
    const p = txt && CONFIG.pagos.find(x => x.info && (x.nombre.toLowerCase() === txt || (txt.length >= 4 && x.nombre.toLowerCase().startsWith(txt))));
    const box = $("payInfo");
    if (p) { box.textContent = p.info; box.style.display = "block"; } else box.style.display = "none";
  });
  renderTabs(); renderMenu(); renderCartBar();
}

function renderTabs(){
  const cats = ["Todos", ...new Set(PRODUCTOS.map(p => p.categoria))];
  if (!cats.includes(currentCat)) currentCat = "Todos";
  $("tabs").innerHTML = "";
  cats.forEach(c => {
    const b = document.createElement("button");
    b.className = "chip";
    b.type = "button";
    b.textContent = c;
    b.setAttribute("aria-pressed", c === currentCat ? "true" : "false");
    b.onclick = () => { currentCat = c; renderTabs(); renderMenu(); };
    $("tabs").appendChild(b);
  });
}

function rowHTML(p){
  const q = cart[p.id] || 0;
  const off = p.disponible === false;
  const thumb = p.imagen ? `<img src="${esc(p.imagen)}" alt="" loading="lazy" decoding="async">` : esc(p.emoji || "🍽️");
  let ctrl;
  if (off) ctrl = `<span class="agotado-txt">Agotado</span>`;
  else if (q > 0) ctrl = `<div class="cant"><button type="button" data-k="${p.id}-menos" onclick="change(${p.id},-1)" aria-label="Quitar uno de ${esc(p.nombre)}">−</button><span aria-live="polite">${q}</span><button type="button" data-k="${p.id}-mas" onclick="change(${p.id},1)" aria-label="Agregar uno de ${esc(p.nombre)}">+</button></div>`;
  else ctrl = `<button type="button" class="mas" data-k="${p.id}-mas" onclick="change(${p.id},1)" aria-label="Agregar ${esc(p.nombre)}">+</button>`;
  return `<li class="row${off ? " agotado" : ""}">
    <div class="thumb">${thumb}</div>
    <div>
      <div class="linea"><span class="nombre">${esc(p.nombre)}</span><span class="punteado" aria-hidden="true"></span><span class="precio">${p.precioNormal > p.precio ? `<s class="antes">${money(p.precioNormal)}</s>` : ""}${money(p.precio)}</span></div>
      ${p.desc ? `<p class="desc">${esc(p.desc)}</p>` : ""}
    </div>
    ${ctrl}
  </li>`;
}

function renderMenu(){
  const cats = currentCat === "Todos" ? [...new Set(PRODUCTOS.map(p => p.categoria))] : [currentCat];
  $("menu").innerHTML = cats.map(c => {
    const list = PRODUCTOS.filter(p => p.categoria === c);
    return `<section class="cat${c === CAT_PROMO ? " promos" : ""}"><h2 class="cat-title">${esc(c)}</h2><ul class="rows">${list.map(rowHTML).join("")}</ul></section>`;
  }).join("");
  if (focusKey) {
    const el = document.querySelector(`[data-k="${focusKey}"]`) || document.querySelector(`[data-k="${focusKey.split("-")[0]}-mas"]`);
    if (el) el.focus({ preventScroll: true });
    focusKey = null;
  }
}

function change(id, d){
  const n = (cart[id] || 0) + d;
  if (n <= 0) delete cart[id]; else cart[id] = n;
  focusKey = id + (d > 0 ? "-mas" : "-menos");
  refPedido = null;
  saveCart(); renderMenu(); renderCartBar();
  if ($("modal").classList.contains("show")) renderSummary();
}

function totals(){
  let count = 0, total = 0;
  Object.entries(cart).forEach(([id, q]) => {
    const p = PRODUCTOS.find(x => x.id == id);
    if (p) { count += q; total += q * p.precio; }
  });
  return { count, total };
}

function renderCartBar(){
  const { count, total } = totals();
  $("cartbar").classList.toggle("show", count > 0);
  $("cartCount").textContent = count + (count === 1 ? " producto" : " productos");
  $("cartTotal").textContent = money(total);
}

function renderSummary(){
  const { count, total } = totals();
  if (count === 0) { closeCheckout(); return; }
  $("summary").innerHTML = Object.entries(cart).map(([id, q]) => {
    const p = PRODUCTOS.find(x => x.id == id);
    return `<div class="ln">
      <span>${q} × ${esc(p.nombre)}</span>
      <span class="q"><b style="margin-right:8px">${money(q * p.precio)}</b>
        <button type="button" onclick="change(${p.id},-1)" aria-label="Quitar uno de ${esc(p.nombre)}">−</button>
        <button type="button" onclick="change(${p.id},1)" aria-label="Agregar uno de ${esc(p.nombre)}">+</button>
      </span></div>`;
  }).join("");
  $("sumTotal").textContent = money(total);
  focusKey = null;
}

function openCheckout(){ $("pedidoForm").hidden = false; $("gracias").hidden = true; renderSummary(); $("modal").classList.add("show"); document.body.style.overflow = "hidden"; }
function closeCheckout(){ $("modal").classList.remove("show"); document.body.style.overflow = ""; }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeCheckout(); });

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function showErr(msg){ const e = $("err"); e.textContent = msg; e.style.display = "block"; }

// Recuerda los datos del cliente en su propio teléfono para el siguiente pedido.
const CAMPOS = ["nombre", "telefono", "calle", "numext", "colonia", "cp"];
try {
  const g = JSON.parse(localStorage.getItem("cliente_v1") || "{}");
  CAMPOS.forEach(k => { if (g[k]) $(k).value = g[k]; });
} catch(e){}

$("form").addEventListener("submit", async ev => {
  ev.preventDefault();
  $("err").style.display = "none";
  const v = id => $(id).value.trim();
  const nombre = v("nombre"), tel = v("telefono").replace(/\D/g, ""),
        calle = v("calle"), numext = v("numext"), colonia = v("colonia"),
        cp = v("cp"), pago = v("pago"), notas = v("notas");

  if (!nombre) return showErr("Escribe tu nombre.");
  if (tel.length !== 10) return showErr("Tu teléfono debe tener 10 dígitos.");
  if (!calle) return showErr("Escribe tu calle.");
  if (!numext) return showErr("Escribe tu número exterior.");
  if (!colonia) return showErr("Escribe tu colonia.");
  if (!/^\d{5}$/.test(cp)) return showErr("El código postal debe tener 5 dígitos.");
  if (!pago) return showErr("Escribe cómo vas a pagar.");

  // Guarda el pedido en la base de datos. El dueño se entera por Telegram.
  const boton = ev.submitter || document.querySelector("#form .enviar");
  const textoBoton = boton.textContent;
  boton.disabled = true; boton.textContent = "Enviando…";
  // Si el cliente reintenta con el mismo carrito, el servidor reconoce este código
  // y no crea un pedido duplicado.
  if (!refPedido) refPedido = Math.random().toString(36).slice(2, 12) + Date.now().toString(36);
  const restaurar = () => { boton.disabled = false; boton.textContent = textoBoton; };

  let folio = "";
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 15000);
    const r = await fetch("/api/pedidos", {
      method: "POST",
      headers: { "content-type": "application/json" },
      signal: ctrl.signal,
      body: JSON.stringify({
        ref: refPedido,
        cliente: { nombre, telefono: tel, calle, numext, colonia, cp },
        pago, notas,
        empresa: ($("empresa") || {}).value || "",
        items: Object.entries(cart).map(([id, q]) => {
          const p = PRODUCTOS.find(x => x.id == id);
          return { id: p.id, nombre: p.nombre, precio: p.precio, qty: q };
        })
      })
    });
    clearTimeout(t);
    if (r.status === 409) {
      const d = await r.json().catch(() => ({}));
      restaurar();
      showErr(d.error || "Una promoción de tu pedido ya no está disponible.");
      refPedido = null;
      await loadMenu(); renderTabs(); renderMenu(); renderCartBar(); renderSummary();
      return;
    }
    if (!r.ok) throw new Error("servidor");
    const d = await r.json(); folio = d.folio || "";
  } catch(e) {
    // El pedido no se guardó: se conserva el carrito para que pueda reintentar.
    restaurar();
    return showErr("No pudimos enviar tu pedido. Revisa tu conexión e inténtalo de nuevo.");
  }

  try { localStorage.setItem("cliente_v1", JSON.stringify({ nombre, telefono: tel, calle, numext, colonia, cp })); } catch(e){}

  // Vacía el carrito para no duplicar el pedido si el cliente regresa a esta página.
  refPedido = null;
  cart = {}; saveCart(); renderMenu(); renderCartBar();
  restaurar();
  $("graciasTxt").textContent = folio ? "Tu folio es " + folio + "." : "";
  $("pedidoForm").hidden = true; $("gracias").hidden = false;
  document.querySelector(".hoja").scrollTop = 0;
});

init();
</script>
</body>
</html>
